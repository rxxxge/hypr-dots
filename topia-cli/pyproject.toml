[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topia"
requires-python = ">=3.13"
# dynamic = ["version"]
version = "0.0.2"
dependencies = [
    "materialyoucolor"
]

[project.scripts]
topia = "topia:main"

# [tool.hatch.version]
# source = "vcs"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
]

[tool.ruff]
line-length = 120
