shell=bash
title=foot
font=FiraCode Nerd Font Mono:style=Retina:size=14
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

include=~/.local/state/topia/theme/foot-colors.ini

[scrollback]
lines=10000

[cursor]
style=block
beam-thickness=1.5

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

